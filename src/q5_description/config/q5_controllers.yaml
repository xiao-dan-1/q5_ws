# Gazebo (gazebo_ros2_control) 用的控制器配置。
# 关节列表沿用旧模型 ~/q5_gazebo/q5_controllers.yaml 那套（38 个位置关节），
# 关节名与官方链一致，已逐个核对存在；wheels 单独走速度控制器。
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    q5_position_controller:
      type: position_controllers/JointGroupPositionController

    q5_wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

    q5_ankle_effort_controller:
      type: effort_controllers/JointGroupEffortController

q5_position_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_arm_yaw_joint
      - left_elbow_pitch_joint
      - left_elbow_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_arm_yaw_joint
      - right_elbow_pitch_joint
      - right_elbow_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
      - left_hand_index_bend_joint
      - left_hand_index_joint1
      - left_hand_index_joint2
      - left_hand_mid_joint1
      - left_hand_mid_joint2
      - left_hand_ring_joint1
      - left_hand_ring_joint2
      - left_hand_pinky_joint1
      - left_hand_pinky_joint2
      - right_hand_index_bend_joint
      - right_hand_index_joint1
      - right_hand_index_joint2
      - right_hand_mid_joint1
      - right_hand_mid_joint2
      - right_hand_ring_joint1
      - right_hand_ring_joint2
      - right_hand_pinky_joint1
      - right_hand_pinky_joint2
      - knee_joint
      - hip_joint
      - waist_yaw_joint
      - neck_yaw_joint
      - neck_pitch_joint
    command_interfaces: [position]
    state_interfaces: [position]

q5_wheel_controller:
  ros__parameters:
    joints:
      - left_drv_wheel_joint
      - right_drv_wheel_joint
    command_interfaces: [velocity]
    state_interfaces: [velocity]

# 踝关节：力矩控制，供平衡控制器用（见 scripts/straight_drive.py --ankle-balance）。
q5_ankle_effort_controller:
  ros__parameters:
    joints: [ankle_joint]
